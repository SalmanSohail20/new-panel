<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cruz Azul — Match Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#060f1f;
    --navy-900:#0a1830;
    --navy-800:#0f2140;
    --navy-700:#16305a;
    --line:#213a63;
    --celeste:#3fc7ff;
    --celeste-dim:#1c5a80;
    --gold:#f2b64c;
    --red:#ef5a5a;
    --ink:#eaf2ff;
    --ink-dim:#8fa3c4;
    --ink-faint:#4d6188;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:radial-gradient(1200px 600px at 15% -10%, #0d2547 0%, var(--navy-950) 55%);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    padding:28px 16px 60px;
    display:flex;
    justify-content:center;
  }
  .sheet{ width:100%; max-width:1400px; }

  /* ---- Header ---- */
  .hero{
    display:flex; align-items:center; gap:16px;
    padding:18px 22px;
    background:linear-gradient(120deg, var(--navy-800) 0%, var(--navy-900) 100%);
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:18px;
  }
  .crest{
    width:46px; height:46px; flex:none;
    border-radius:50%;
    background:conic-gradient(from 210deg, var(--celeste), var(--navy-700) 60%, var(--celeste));
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-weight:700; font-size:15px; color:var(--navy-950);
    box-shadow:0 0 0 3px var(--navy-950), 0 0 0 4px var(--celeste-dim);
  }
  .hero-text .club{ font-family:'Oswald',sans-serif; font-size:20px; font-weight:600; letter-spacing:.02em; }
  .hero-text .club span{ color:var(--celeste); }
  .hero-text .sub{ font-size:12px; color:var(--ink-dim); margin-top:2px; }

  /* ---- Grid wrap: tab stack + table ---- */
  .grid-wrap{
    display:flex;
    align-items:flex-start;
  }
  .half-tabs{
    display:flex;
    flex-direction:column;
    width:82px;
    flex:none;
    border:1px solid var(--line);
    border-right:none;
    border-radius:12px 0 0 12px;
    overflow:hidden;
    background:var(--navy-900);
  }
  .half-tab{
    appearance:none; border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    color:var(--ink-dim);
    font-family:'Oswald',sans-serif;
    font-size:12.5px; font-weight:500; letter-spacing:.02em;
    padding:16px 12px;
    text-align:left;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .half-tab:last-child{ border-bottom:none; }
  .half-tab:hover{ color:var(--ink); background:var(--navy-800); }
  .half-tab.active{
    background:var(--celeste);
    color:var(--navy-950);
    font-weight:700;
  }

  .table-scroll{
    flex:1;
    min-width:0;
    min-height:calc(100vh - 170px);
    overflow-x:auto;
    overflow-y:auto;
    border:1px solid var(--line);
    border-radius:0 12px 12px 12px;
    background:var(--navy-900);
  }
  table{ width:100%; border-collapse:collapse; min-width:1100px; }
  thead th{
    text-align:center;
    font-family:'Oswald',sans-serif;
    font-weight:500;
    font-size:11px;
    letter-spacing:.05em;
    color:var(--ink-dim);
    padding:14px 6px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  thead th:first-child{ text-align:left; padding-left:18px; min-width:170px; }

  tbody td{
    text-align:center;
    padding:8px 6px;
    border-bottom:1px solid rgba(33,58,99,.5);
  }
  tbody tr:hover td{ background:rgba(63,199,255,.035); }
  tbody tr:last-of-type td{ border-bottom:none; }

  .player-cell{
    display:flex; align-items:center; gap:9px;
    text-align:left; padding-left:18px !important;
  }
  .num-badge{
    width:22px; height:22px; flex:none;
    border-radius:6px;
    background:var(--navy-700);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-size:10.5px; font-weight:500;
    color:var(--ink-dim);
  }
  .player-name{ color:var(--ink); font-size:13px; font-weight:500; white-space:nowrap; }

  .cell-input{
    width:44px;
    text-align:center;
    background:var(--navy-800);
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 2px;
    color:var(--ink);
    font-family:'Oswald',sans-serif;
    font-size:12.5px;
    outline:none;
    -moz-appearance:textfield;
    appearance:textfield;
  }
  .cell-input:focus{ border-color:var(--celeste-dim); }
  .cell-input::-webkit-outer-spin-button,
  .cell-input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }

  .cell-text{
    width:120px;
    background:var(--navy-800);
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 8px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:12px;
    outline:none;
  }
  .cell-text:focus{ border-color:var(--celeste-dim); }

  .cell-select{
    background:var(--navy-800);
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 4px;
    color:var(--ink);
    font-family:'Oswald',sans-serif;
    font-size:11.5px;
    outline:none;
  }

  .shot-cell{
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:5px;
    white-space:nowrap;
  }
  .shot-cell .cell-input{ width:38px; }
  .shot-cell .cell-select{ width:72px; }

  .time-cell{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    white-space:nowrap;
  }
  .time-cell .cell-input{ width:40px; }
  .time-sep{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    color:var(--ink-dim);
    line-height:1;
  }

  .pill{
    display:inline-block;
    min-width:22px;
    padding:3px 7px;
    border-radius:5px;
    font-family:'Oswald',sans-serif;
    font-size:12.5px;
    color:var(--ink-dim);
  }
  .pill.zero{ color:var(--ink-faint); }
  .pill.goal{ background:var(--gold); color:var(--navy-950); font-weight:700; }
  .pill.card-y{ background:var(--gold); color:var(--navy-950); font-weight:700; }
  .pill.card-r{ background:var(--red); color:#fff; font-weight:700; }
  .pill.dash{ color:var(--ink-faint); }
  .txt-readonly{ font-size:11.5px; color:var(--ink-dim); }
  .txt-readonly.empty{ color:var(--ink-faint); }

  /* add player row */
  .add-row td{
    padding:0;
    border-bottom:none;
  }
  .add-player-btn{
    width:100%;
    appearance:none; border:none;
    background:transparent;
    color:var(--celeste);
    font-family:'Oswald',sans-serif;
    font-size:12.5px; font-weight:600; letter-spacing:.03em;
    padding:13px;
    text-align:left;
    padding-left:18px;
    cursor:pointer;
    border-top:1px dashed var(--line);
    transition:background .15s ease;
  }
  .add-player-btn:hover{ background:rgba(63,199,255,.06); }

  .search-wrap{ position:relative; width:210px; }
  .search-input{
    width:100%;
    background:var(--navy-800);
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 10px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:13px;
    outline:none;
  }
  .search-input:focus{ border-color:var(--celeste-dim); }
  .search-dropdown{
    display:none;
    position:absolute;
    top:calc(100% + 4px);
    left:0; right:0;
    max-height:220px;
    overflow-y:auto;
    background:var(--navy-800);
    border:1px solid var(--line);
    border-radius:8px;
    padding:5px;
    z-index:20;
    box-shadow:0 10px 24px rgba(0,0,0,.35);
  }
  .search-dropdown.open{ display:block; }
  .search-opt{
    width:100%;
    display:flex; align-items:center; gap:9px;
    appearance:none; border:none; background:transparent;
    color:var(--ink);
    padding:7px 8px;
    border-radius:6px;
    cursor:pointer;
    text-align:left;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
  }
  .search-opt:hover{ background:var(--navy-700); }
  .search-opt .pname{ font-weight:500; }
  .search-empty{
    padding:10px 8px;
    font-size:12px;
    color:var(--ink-faint);
  }

  /* unsaved (editable) player row */
  tr.pending-row td{ background:rgba(63,199,255,.05); }
  .pending-cell{
    display:flex; align-items:center; gap:8px;
    text-align:left; padding-left:18px !important;
  }

  .row-actions{
    display:flex; gap:6px; justify-content:center;
  }
  .row-save{
    appearance:none; border:1px solid var(--celeste);
    border-radius:6px;
    padding:5px 10px;
    font-family:'Oswald',sans-serif;
    font-size:11px; font-weight:700; letter-spacing:.02em;
    cursor:pointer;
    background:var(--celeste);
    color:var(--navy-950);
    transition:opacity .15s ease;
  }
  .row-save:hover{ opacity:.85; }

  .row-edit, .row-del{
    appearance:none; border:1px solid var(--line);
    border-radius:6px;
    padding:5px 10px;
    font-family:'Oswald',sans-serif;
    font-size:11px; font-weight:600; letter-spacing:.02em;
    cursor:pointer;
    background:var(--navy-800);
    color:var(--ink-dim);
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .row-edit:hover{ border-color:var(--celeste-dim); color:var(--celeste); }
  .row-del:hover{ border-color:var(--red); color:var(--red); }

  .row-del-confirm, .row-del-cancel{
    appearance:none; border:1px solid var(--line);
    border-radius:6px;
    padding:5px 10px;
    font-family:'Oswald',sans-serif;
    font-size:11px; font-weight:600; letter-spacing:.02em;
    cursor:pointer;
  }
  .row-del-confirm{ background:var(--red); border-color:var(--red); color:#fff; }
  .row-del-confirm:hover{ opacity:.85; }
  .row-del-cancel{ background:var(--navy-800); color:var(--ink-faint); }
  .row-del-cancel:hover{ color:var(--ink); }

  .cell-input:disabled, .cell-text:disabled, .cell-select:disabled{
    opacity:.4;
    cursor:not-allowed;
  }

  .legend{
    display:flex; flex-wrap:wrap; gap:14px;
    padding:12px 18px 0;
    font-size:10.5px; color:var(--ink-faint);
  }
  .legend b{ color:var(--ink-dim); font-weight:600; }

  @media (max-width:640px){
    .half-tabs{ width:64px; }
    .half-tab{ padding:12px 8px; font-size:11px; }
    thead th{ font-size:9.5px; padding:11px 4px; }
    .player-name{ font-size:12px; }
  }
</style>
</head>
<body>
<div class="sheet">

  <div class="hero">
    <div class="crest">CA</div>
    <div class="hero-text">
      <div class="club">Cruz <span>Azul</span></div>
      <div class="sub">Live match event log — tap a half, edit stats per player, Full auto-sums both halves</div>
    </div>
  </div>

  <div class="grid-wrap">
    <div class="half-tabs" id="halfTabs">
      <button class="half-tab active" data-half="first">1st H</button>
      <button class="half-tab" data-half="second">2nd H</button>
      <button class="half-tab" data-half="full">Full</button>
    </div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Player</th>
            <th>Shot</th>
            <th>SOT</th>
            <th>SOFF</th>
            <th>SB</th>
            <th>GS</th>
            <th>Foul Committed / Won</th>
            <th>Corner</th>
            <th>Penalty</th>
            <th>Goal</th>
            <th>Card</th>
            <th>Time</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
        <tfoot>
          <tr class="add-row">
            <td colspan="13">
              <button class="add-player-btn" id="addPlayerBtn">+ Add player</button>
            </td>
          </tr>
        </tfoot>
      </table>
      <div class="legend">
        <span><b>SOT</b> on target</span>
        <span><b>SOFF</b> off target</span>
        <span><b>SB</b> blocked</span>
        <span><b>GS</b> keeper saves faced</span>
        <span><b>Full</b> = 1st H + 2nd H (read-only)</span>
      </div>
    </div>
  </div>

</div>

<script>
const EMPTY_STAT = () => ({ shot:0, shotType:"", zone:"", sot:0, soff:0, sb:0, gs:0, foulCount:0, foulType:"", foulComment:"", corner:0, penalty:0, goal:0, card:"", timeMin:"", timeSec:"" });

const ROSTER = [
  { n:23, name:"Kevin Mier" },
  { n:4,  name:"Willer Ditta" },
  { n:5,  name:"Jesus Orozco Chiquete" },
  { n:8,  name:"Agustin Palavecino" },
  { n:17, name:"Amaury Garcia" },
  { n:19, name:"Charly Rodriguez" },
  { n:3,  name:"Omar Campos" },
  { n:16, name:"Jeremy Marquez" },
  { n:55, name:"Rogelio Gonzalez" },
  { n:7,  name:"Nicolas Ibanez" },
  { n:18, name:"Luka Romero" },
  { n:1,  name:"Andres Gudino" },
  { n:2,  name:"Gonzalo Piovi" },
  { n:6,  name:"Erik Lira" },
  { n:10, name:"Ignacio Rivero" },
  { n:11, name:"Mateusz Bogusz" },
  { n:9,  name:"Angel Sepulveda" },
  { n:20, name:"Carlos Rotondi" },
  { n:21, name:"Jorge Sanchez" },
  { n:22, name:"Ramiro Funes Mori" },
  { n:24, name:"Alexis Gutierrez" },
  { n:25, name:"Gabriel Fernandez" },
];

let activeHalf = "first"; // 'first' | 'second' | 'full'
const NUM_FIELDS = ["shot","sot","soff","sb","gs","foulCount","corner","penalty","goal"];
const TEXT_FIELDS = ["shotType","zone","foulType","card"];

/* each half keeps its own list of rows — nothing entered in one half
   shows up in the other; "full" merges them per player, read-only */
const rowsByHalf = { first: [], second: [] };
function currentRows(){ return rowsByHalf[activeHalf] || []; }

function timeLabel(st){
  const m = st.timeMin, sec = st.timeSec;
  if(m === "" && sec === "") return "";
  return `${String(m === "" ? 0 : m).padStart(2,"0")}:${String(sec === "" ? 0 : sec).padStart(2,"0")}`;
}

function fullRows(){
  const merged = new Map();
  ["first","second"].forEach(half => {
    rowsByHalf[half].forEach(r => {
      if(r.pending) return;
      const key = `${r.n}|${r.name}`;
      if(!merged.has(key)) merged.set(key, { n:r.n, name:r.name, stat:EMPTY_STAT(), time:"" });
      const m = merged.get(key);
      NUM_FIELDS.forEach(k => m.stat[k] = (m.stat[k]||0) + (r.stat[k]||0));
      TEXT_FIELDS.forEach(k => m.stat[k] = [m.stat[k], r.stat[k]].filter(Boolean).join(", "));
      m.time = [m.time, timeLabel(r.stat)].filter(Boolean).join(", ");
    });
  });
  return [...merged.values()];
}

function numInput(r, field, idx){
  const val = r.stat[field];
  const dis = r.locked ? "disabled" : "";
  return `<input type="number" min="0" class="cell-input" value="${val}" ${dis}
    data-idx="${idx}" data-half="${activeHalf}" data-field="${field}">`;
}
function timeInput(r, idx){
  const dis = r.locked ? "disabled" : "";
  return `<div class="time-cell">
    <input type="number" min="0" max="130" class="cell-input" placeholder="00" value="${r.stat.timeMin}" ${dis}
      data-idx="${idx}" data-half="${activeHalf}" data-field="timeMin">
    <span class="time-sep">:</span>
    <input type="number" min="0" max="59" class="cell-input" placeholder="00" value="${r.stat.timeSec}" ${dis}
      data-idx="${idx}" data-half="${activeHalf}" data-field="timeSec">
  </div>`;
}
function cellSelect(r, idx, field, options){
  const val = r.stat[field];
  const dis = r.locked ? "disabled" : "";
  const opts = options.map(o =>
    `<option value="${o}" ${o===val?"selected":""}>${o||"—"}</option>`).join("");
  return `<select class="cell-select" ${dis} data-idx="${idx}" data-half="${activeHalf}" data-field="${field}">${opts}</select>`;
}
const foulTypeSelect = (r, idx) => cellSelect(r, idx, "foulType", ["", "Foul Committed", "Foul Won"]);
const cardSelect     = (r, idx) => cellSelect(r, idx, "card",     ["", "Yellow", "Red"]);
const shotTypeSelect = (r, idx) => cellSelect(r, idx, "shotType", ["", "Left F", "Right F", "Header", "Other"]);
const zoneSelect     = (r, idx) => cellSelect(r, idx, "zone",     ["", "Inside", "Outside"]);

function readonlyPill(v, kind){
  if(kind === "goal" && v > 0) return `<span class="pill goal">${v}</span>`;
  return `<span class="pill ${v===0?'zero':''}">${v}</span>`;
}
function readonlyText(v){
  return v ? `<span class="txt-readonly">${v}</span>` : `<span class="txt-readonly empty">—</span>`;
}
function readonlyCard(v){
  if(!v) return `<span class="pill dash">—</span>`;
  if(v.includes("Red")) return `<span class="pill card-r">${v}</span>`;
  return `<span class="pill card-y">${v}</span>`;
}

let pendingDeleteIdx = null;

function playerCellHTML(r, idx){
  if(activeHalf !== "full" && (r.pending || r.editingPlayer)){
    const badge = r.pending ? "" : `<div class="num-badge">${r.n}</div>`;
    return `<td class="player-cell pending-cell">
      ${badge}
      <div class="search-wrap">
        <input type="text" class="search-input" data-idx="${idx}" value="${r.pending ? "" : r.name}"
          placeholder="Search by name or number..." autocomplete="off">
        <div class="search-dropdown"></div>
      </div>
    </td>`;
  }
  return `<td class="player-cell"><div class="num-badge">${r.n}</div><span class="player-name">${r.name}</span></td>`;
}

function rowActionsHTML(r, idx){
  if(activeHalf === "full") return `<span class="pill dash">—</span>`;
  if(pendingDeleteIdx === idx){
    return `<div class="row-actions"><button class="row-del-confirm" data-idx="${idx}">Confirm</button><button class="row-del-cancel" data-idx="${idx}">Cancel</button></div>`;
  }
  const mainBtn = r.locked
    ? `<button class="row-edit" data-idx="${idx}">Edit</button>`
    : `<button class="row-save" data-idx="${idx}">Save</button>`;
  return `<div class="row-actions">${mainBtn}<button class="row-del" data-idx="${idx}">Del</button></div>`;
}

function render(){
  const body = document.getElementById('tableBody');
  body.innerHTML = "";

  const rows = activeHalf === "full" ? fullRows() : currentRows();

  rows.forEach((r, idx) => {
    const tr = document.createElement('tr');

    if(activeHalf === "full"){
      const st = r.stat;
      tr.innerHTML = `
        ${playerCellHTML(r, idx)}
        <td><div class="shot-cell">${readonlyPill(st.shot)}<span class="txt-readonly ${st.shotType?'':'empty'}">${st.shotType||'—'}</span><span class="txt-readonly ${st.zone?'':'empty'}">${st.zone||'—'}</span></div></td>
        <td>${readonlyPill(st.sot)}</td>
        <td>${readonlyPill(st.soff)}</td>
        <td>${readonlyPill(st.sb)}</td>
        <td>${readonlyPill(st.gs)}</td>
        <td><div class="shot-cell">${readonlyPill(st.foulCount)}${readonlyText(st.foulType)}</div></td>
        <td>${readonlyPill(st.corner)}</td>
        <td>${readonlyPill(st.penalty)}</td>
        <td>${readonlyPill(st.goal, "goal")}</td>
        <td>${readonlyCard(st.card)}</td>
        <td>${readonlyText(r.time)}</td>
        <td>${rowActionsHTML(r, idx)}</td>
      `;
    } else {
      if(!r.locked) tr.className = 'pending-row';
      tr.innerHTML = `
        ${playerCellHTML(r, idx)}
        <td><div class="shot-cell">${numInput(r,"shot",idx)}${shotTypeSelect(r,idx)}${zoneSelect(r,idx)}</div></td>
        <td>${numInput(r,"sot",idx)}</td>
        <td>${numInput(r,"soff",idx)}</td>
        <td>${numInput(r,"sb",idx)}</td>
        <td>${numInput(r,"gs",idx)}</td>
        <td><div class="shot-cell">${numInput(r,"foulCount",idx)}${foulTypeSelect(r,idx)}</div></td>
        <td>${numInput(r,"corner",idx)}</td>
        <td>${numInput(r,"penalty",idx)}</td>
        <td>${numInput(r,"goal",idx)}</td>
        <td>${cardSelect(r,idx)}</td>
        <td>${timeInput(r,idx)}</td>
        <td>${rowActionsHTML(r, idx)}</td>
      `;
    }
    body.appendChild(tr);
  });

  // wire up inputs (only present when not "full")
  body.querySelectorAll('input.cell-input, input.cell-text, select.cell-select').forEach(el => {
    el.addEventListener('change', (e) => {
      const idx = +e.target.dataset.idx;
      const half = e.target.dataset.half;
      const field = e.target.dataset.field;
      const row = rowsByHalf[half] && rowsByHalf[half][idx];
      if(!row) return;
      let val = e.target.value;
      if(field === 'timeMin' || field === 'timeSec'){
        if(val.trim() === ""){
          val = "";
        } else {
          const cap = field === 'timeSec' ? 59 : 130;
          val = Math.min(cap, Math.max(0, parseInt(val, 10) || 0));
          e.target.value = val;
        }
      } else if(e.target.tagName === 'INPUT' && e.target.type === 'number'){
        val = Math.max(0, parseInt(val || 0, 10));
      }
      row.stat[field] = val;
    });
  });

  wirePlayerSearch();
}

/* every unlocked row's player cell holds its own roster picker */
function wirePlayerSearch(){
  const body = document.getElementById('tableBody');

  body.querySelectorAll('.search-wrap').forEach(wrap => {
    const searchInput = wrap.querySelector('.search-input');
    const dropdown = wrap.querySelector('.search-dropdown');
    if(!searchInput || !dropdown) return;
    const idx = +searchInput.dataset.idx;

    function renderOptions(query){
      const q = query.trim().toLowerCase();
      // the same player can be added to as many rows as needed
      const matches = ROSTER.filter(r =>
        q === "" || r.name.toLowerCase().includes(q) || String(r.n).includes(q)
      ).slice(0, 8);

      if(matches.length === 0){
        dropdown.innerHTML = `<div class="search-empty">No matching players</div>`;
      } else {
        dropdown.innerHTML = matches.map(r => `
          <button type="button" class="search-opt" data-name="${r.name}" data-num="${r.n}">
            <span class="num-badge">${r.n}</span><span class="pname">${r.name}</span>
          </button>
        `).join("");
      }
      dropdown.classList.add('open');
    }

    searchInput.addEventListener('input', () => renderOptions(searchInput.value));
    searchInput.addEventListener('focus', () => renderOptions(""));
    searchInput.addEventListener('blur', () => {
      dropdown.classList.remove('open');
      // typing without picking never changes the player
      const row = currentRows()[idx];
      searchInput.value = (row && !row.pending) ? row.name : "";
    });

    dropdown.addEventListener('mousedown', (e) => {
      const opt = e.target.closest('.search-opt');
      if(!opt) return;
      e.preventDefault();
      const row = currentRows()[idx];
      if(!row) return;
      row.n = opt.dataset.num;
      row.name = opt.dataset.name;
      delete row.pending;
      render();
    });
  });

  // a freshly added row opens with the picker focused
  const pendingIdx = currentRows().findIndex(r => r.pending);
  if(pendingIdx !== -1){
    const input = body.querySelector(`.search-input[data-idx="${pendingIdx}"]`);
    if(input) input.focus();
  }
}

render();

document.getElementById('tableBody').addEventListener('click', (e) => {
  if(activeHalf === "full") return;
  const rows = currentRows();
  const editBtn = e.target.closest('.row-edit');
  const delBtn = e.target.closest('.row-del');
  const delConfirmBtn = e.target.closest('.row-del-confirm');
  const delCancelBtn = e.target.closest('.row-del-cancel');
  const saveBtn = e.target.closest('.row-save');

  if(saveBtn){
    const idx = +saveBtn.dataset.idx;
    const row = rows[idx];
    if(!row) return;
    if(row.pending){
      // no player picked yet — keep the row open and point at the picker
      const search = saveBtn.closest('tr').querySelector('.search-input');
      if(search) search.focus();
      return;
    }
    row.locked = true;
    row.editingPlayer = false;
    pendingDeleteIdx = null;
    render();
  } else if(editBtn){
    const row = rows[+editBtn.dataset.idx];
    if(row){
      row.locked = false;
      row.editingPlayer = true;
    }
    pendingDeleteIdx = null;
    render();
  } else if(delBtn){
    const idx = +delBtn.dataset.idx;
    if(rows[idx] && rows[idx].pending){
      rows.splice(idx, 1);
    } else {
      pendingDeleteIdx = idx;
    }
    render();
  } else if(delConfirmBtn){
    rows.splice(+delConfirmBtn.dataset.idx, 1);
    pendingDeleteIdx = null;
    render();
  } else if(delCancelBtn){
    pendingDeleteIdx = null;
    render();
  }
});

document.getElementById('halfTabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.half-tab');
  if(!btn) return;
  document.querySelectorAll('.half-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  activeHalf = btn.dataset.half;
  pendingDeleteIdx = null;
  render();
});

document.getElementById('addPlayerBtn').addEventListener('click', () => {
  // "full" is a read-only summary — drop into 1st H to enter anything
  if(activeHalf === "full"){
    activeHalf = "first";
    document.querySelectorAll('.half-tab').forEach(t => t.classList.toggle('active', t.dataset.half === 'first'));
    render();
  }
  const rows = currentRows();
  const openIdx = rows.findIndex(r => r.pending);
  if(openIdx !== -1){
    const el = document.querySelector(`.search-input[data-idx="${openIdx}"]`);
    if(el) el.focus();
    return;
  }
  pendingDeleteIdx = null;
  rows.push({ n:"?", name:"", pending:true, locked:false, stat:EMPTY_STAT() });
  render();
  const row = document.querySelector('tr.pending-row');
  if(row) row.scrollIntoView({ block:'nearest' });
});
</script>
